<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesium-Twin-Agent · 三维态势仿真与水动力孪生平台</title>
  <!-- Three.js & OrbitControls -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #030712;
      --panel-bg: rgba(15, 23, 42, 0.88);
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(51, 65, 85, 0.8);
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #webgl-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Top Nav */
    #header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: linear-gradient(180deg, rgba(3, 7, 18, 0.95), transparent);
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
    }
    .telemetry-badges {
      display: flex;
      gap: 16px;
      font-size: 12px;
    }
    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 4px;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px var(--success); }

    /* Left Floating Panel */
    .floating-panel {
      position: absolute;
      top: 76px;
      left: 24px;
      width: 320px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      border-radius: 10px;
      padding: 18px;
      z-index: 100;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    .panel-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
      font-size: 13px;
    }
    .stat-val { font-weight: 700; font-family: ui-monospace, monospace; }

    /* Water Gauge */
    .water-gauge-container {
      margin: 14px 0;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
    }
    .gauge-bar-bg {
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 6px;
    }
    .gauge-bar-fill {
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #38bdf8, #3b82f6);
      transition: width 0.5s ease;
    }

    /* Actions */
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      transition: all 0.2s;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-green { background: linear-gradient(135deg, #059669, #10b981); }
    .btn-rose { background: linear-gradient(135deg, #e11d48, #f43f5e); }

    /* Right Bottom Log Console */
    #log-console {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 420px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      border-radius: 10px;
      padding: 14px 18px;
      z-index: 100;
      font-size: 12px;
      line-height: 1.5;
    }
    .log-header { font-weight: 700; color: #94a3b8; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .log-content { font-family: ui-monospace, monospace; color: #e2e8f0; max-height: 90px; overflow-y: auto; }
  </style>
</head>
<body>

  <header id="header">
    <div class="brand">
      <i data-lucide="layers" style="color:var(--accent);"></i>
      <span>Cesium-Twin-Agent · 水动力态势三维仿真</span>
    </div>
    <div class="telemetry-badges">
      <div class="badge"><div class="dot"></div><span>三维 WebGL 引擎: 60 FPS</span></div>
      <div class="badge"><i data-lucide="droplet" style="width:14px;color:var(--accent);"></i><span id="txt-rain">降雨量: 0 mm/h</span></div>
      <div class="badge"><i data-lucide="radio" style="width:14px;color:var(--warning);"></i><span>Agent 协同通道: 正常</span></div>
    </div>
  </header>

  <div id="webgl-container"></div>

  <!-- Left Telemetry Panel -->
  <div class="floating-panel">
    <div class="panel-title">
      <i data-lucide="activity" style="width:16px;"></i>
      <span>水文与淹没实时反演</span>
    </div>

    <div class="stat-row">
      <span style="color:#94a3b8;">监测基准高程:</span>
      <span class="stat-val" id="val-water">18.50 m</span>
    </div>
    <div class="stat-row">
      <span style="color:#94a3b8;">防汛警戒水位:</span>
      <span class="stat-val" style="color:var(--danger);">21.00 m</span>
    </div>
    <div class="stat-row">
      <span style="color:#94a3b8;">受浸润建筑单体:</span>
      <span class="stat-val" id="val-buildings">0 栋</span>
    </div>

    <div class="water-gauge-container">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;">
        <span>库容蓄水率</span>
        <span id="val-ratio">42%</span>
      </div>
      <div class="gauge-bar-bg">
        <div class="gauge-bar-fill" id="bar-gauge"></div>
      </div>
    </div>

    <button class="btn" id="btn-rainfall">
      <i data-lucide="cloud-rain" style="width:15px;"></i>
      <span>模拟暴雨水动力抬升 (50mm)</span>
    </button>
    <button class="btn btn-green" id="btn-drone">
      <i data-lucide="navigation" style="width:15px;"></i>
      <span>调度无人机三维样条巡检</span>
    </button>
    <button class="btn btn-rose" id="btn-drain" style="display:none;">
      <i data-lucide="shield-alert" style="width:15px;"></i>
      <span>下达应急排涝泵站抢险</span>
    </button>
  </div>

  <!-- Bottom Log Console -->
  <div id="log-console">
    <div class="log-header">
      <span>智能体决策与遥测调度流水</span>
      <span style="color:var(--accent);">WebSocket 双向流</span>
    </div>
    <div class="log-content" id="log-text">
      [00:00:01] 3D 数字孪生底座初始化完成，加载 48 处建筑白模与水动力网格。<br/>
      [00:00:02] 系统就绪，支持通过左键旋转视角、右键平移、滚轮缩放。
    </div>
  </div>

  <script>
    lucide.createIcons();

    // 1. 初始化 Three.js 场景
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030712);
    scene.fog = new THREE.FogExp2(0x030712, 0.007);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.set(70, 50, 80);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2.05; // 限制在地面以上

    // 2. 光照设置
    const ambientLight = new THREE.AmbientLight(0x38bdf8, 0.35);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(40, 80, 50);
    scene.add(dirLight);

    // 3. 地表与建筑物网格（模拟数字孪生白模）
    const gridHelper = new THREE.GridHelper(160, 40, 0x1e3a8a, 0x0f172a);
    gridHelper.position.y = 0;
    scene.add(gridHelper);

    const buildingsGroup = new THREE.Group();
    scene.add(buildingsGroup);

    const buildingMaterial = new THREE.MeshLambertMaterial({
      color: 0x1e293b,
      wireframe: false,
      transparent: true,
      opacity: 0.9
    });
    const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.4 });

    const buildingPositions = [];
    for (let x = -60; x <= 60; x += 20) {
      for (let z = -60; z <= 60; z += 20) {
        if (Math.abs(x) < 15 && Math.abs(z) < 15) continue; // 中心低洼区留给水面
        const h = 8 + Math.random() * 22;
        const geo = new THREE.BoxGeometry(10, h, 10);
        const b = new THREE.Mesh(geo, buildingMaterial);
        b.position.set(x + (Math.random() - 0.5) * 4, h / 2, z + (Math.random() - 0.5) * 4);
        buildingsGroup.add(b);

        const edges = new THREE.EdgesGeometry(geo);
        const line = new THREE.LineSegments(edges, edgeMaterial);
        b.add(line);

        buildingPositions.push({ mesh: b, baseHeight: h });
      }
    }

    // 4. 自定义 GLSL 动态水动力淹没水面网格
    const waterGeo = new THREE.PlaneGeometry(120, 120, 64, 64);
    waterGeo.rotateX(-Math.PI / 2);

    const waterMat = new THREE.ShaderMaterial({
      uniforms: {
        u_time: { value: 0 },
        u_waterElevation: { value: 1.5 },
        u_shallowColor: { value: new THREE.Color(0x38bdf8) },
        u_deepColor: { value: new THREE.Color(0x0c4a6e) }
      },
      vertexShader: `
        uniform float u_time;
        varying vec2 vUv;
        varying float vWave;
        void main() {
          vUv = uv;
          vec3 pos = position;
          float w1 = sin(pos.x * 0.15 + u_time * 2.0);
          float w2 = cos(pos.z * 0.12 + u_time * 1.5);
          float wave = (w1 + w2) * 0.6;
          vWave = wave;
          pos.y += wave;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 u_shallowColor;
        uniform vec3 u_deepColor;
        varying vec2 vUv;
        varying float vWave;
        void main() {
          float factor = clamp((vWave + 0.6) / 1.2, 0.0, 1.0);
          vec3 col = mix(u_deepColor, u_shallowColor, factor);
          gl_FragColor = vec4(col, 0.82);
        }
      `,
      transparent: true,
      side: THREE.DoubleSide
    });

    const waterMesh = new THREE.Mesh(waterGeo, waterMat);
    waterMesh.position.y = 1.5;
    scene.add(waterMesh);

    // 5. 无人机巡检航点与 3D 样条线 (Catmull-Rom)
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-40, 25, -40),
      new THREE.Vector3(0, 32, -35),
      new THREE.Vector3(40, 22, 0),
      new THREE.Vector3(15, 28, 40),
      new THREE.Vector3(-30, 20, 20)
    ], true);

    const points = curve.getPoints(100);
    const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
    const splineLine = new THREE.Line(lineGeo, new THREE.LineDashedMaterial({
      color: 0x10b981,
      dashSize: 2,
      gapSize: 1,
      transparent: true,
      opacity: 0.8
    }));
    splineLine.computeLineDistances();
    scene.add(splineLine);

    // 无人机标记球
    const droneGeo = new THREE.SphereGeometry(1.2, 16, 16);
    const droneMat = new THREE.MeshBasicMaterial({ color: 0x10b981 });
    const droneMesh = new THREE.Mesh(droneGeo, droneMat);
    scene.add(droneMesh);

    // 6. 交互状态
    let currentWaterY = 1.5;
    let targetWaterY = 1.5;
    let waterLevelM = 18.50;
    let isDroneActive = false;
    let droneT = 0;

    const valWater = document.getElementById('val-water');
    const valBuildings = document.getElementById('val-buildings');
    const valRatio = document.getElementById('val-ratio');
    const barGauge = document.getElementById('bar-gauge');
    const logText = document.getElementById('log-text');
    const btnDrain = document.getElementById('btn-drain');

    function appendLog(msg) {
      const time = new Date().toTimeString().split(' ')[0];
      logText.innerHTML += `<br/>[${time}] ${msg}`;
      logText.scrollTop = logText.scrollHeight;
    }

    document.getElementById('btn-rainfall').onclick = () => {
      targetWaterY += 1.8;
      waterLevelM += 0.8;
      document.getElementById('txt-rain').innerText = "降雨量: 52 mm/h";
      valWater.innerText = `${waterLevelM.toFixed(2)} m`;
      
      const ratio = Math.min(100, Math.round(42 + (targetWaterY - 1.5) * 15));
      valRatio.innerText = `${ratio}%`;
      barGauge.style.width = `${ratio}%`;

      appendLog(`[Agent 决策] 气象接入暴雨 52mm/h，水动力反演水位抬升至 ${waterLevelM.toFixed(2)}m。`);

      if (waterLevelM >= 21.0) {
        valWater.style.color = "var(--danger)";
        valBuildings.innerText = "6 栋 (浸润)";
        valBuildings.style.color = "var(--danger)";
        btnDrain.style.display = "flex";
        appendLog(`<span style="color:var(--danger)">[告警中枢] 突破 21.00m 防汛警戒线！低洼地带已浸润 6 栋单体。</span>`);
      }
    };

    document.getElementById('btn-drone').onclick = () => {
      isDroneActive = true;
      appendLog(`[Agent 调度] 启动无人机自主巡检，加载 Catmull-Rom 样条轨迹矩阵。`);
    };

    btnDrain.onclick = () => {
      targetWaterY = 1.5;
      waterLevelM = 18.50;
      valWater.innerText = "18.50 m";
      valWater.style.color = "#fff";
      valBuildings.innerText = "0 栋";
      valBuildings.style.color = "#fff";
      barGauge.style.width = "42%";
      valRatio.innerText = "42%";
      document.getElementById('txt-rain').innerText = "降雨量: 0 mm/h";
      btnDrain.style.display = "none";
      appendLog(`[应急联动] 排涝泵站全负荷启泵排泄，水位平稳回落至 18.50m 基准高程。`);
    };

    // 7. 渲染循环
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // 着色器时间步进
      waterMat.uniforms.u_time.value = time;

      // 平滑抬升水位
      if (Math.abs(waterMesh.position.y - targetWaterY) > 0.01) {
        waterMesh.position.y += (targetWaterY - waterMesh.position.y) * 0.05;
      }

      // 无人机漫游
      if (isDroneActive) {
        droneT = (droneT + 0.003) % 1.0;
        const pos = curve.getPointAt(droneT);
        droneMesh.position.copy(pos);
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
